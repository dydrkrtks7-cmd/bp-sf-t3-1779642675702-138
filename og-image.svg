<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2185b"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="751" cy="579" r="75" fill="#e91e63" opacity="0.19"/>
    <circle cx="1239" cy="492" r="30" fill="#e91e63" opacity="0.07"/>
    <circle cx="-55" cy="10" r="74" fill="#e91e63" opacity="0.19"/>
    <circle cx="1206" cy="618" r="52" fill="#e91e63" opacity="0.18"/>
    <circle cx="94" cy="486" r="96" fill="#e91e63" opacity="0.12"/>
    <circle cx="277" cy="227" r="78" fill="#e91e63" opacity="0.17"/>
    <rect x="719" y="600" width="52" height="59" rx="8" fill="#c2185b" opacity="0.15" transform="rotate(15, 98, 43)"/>
    <rect x="-41" y="184" width="45" height="50" rx="8" fill="#c2185b" opacity="0.06" transform="rotate(26, 403, 437)"/>
    <rect x="123" y="412" width="26" height="77" rx="8" fill="#c2185b" opacity="0.03" transform="rotate(1, 827, 86)"/>
    <rect x="1268" y="499" width="92" height="49" rx="8" fill="#c2185b" opacity="0.05" transform="rotate(1, -69, 597)"/>
    <rect x="344" y="-92" width="83" height="67" rx="8" fill="#c2185b" opacity="0.15" transform="rotate(24, 740, 491)"/>
    <rect x="1261" y="357" width="81" height="87" rx="8" fill="#c2185b" opacity="0.04" transform="rotate(4, 304, 211)"/>
    <rect x="89" y="425" width="65" height="25" rx="8" fill="#c2185b" opacity="0.03" transform="rotate(2, 103, 477)"/>
    <rect x="588" y="494" width="61" height="65" rx="8" fill="#c2185b" opacity="0.14" transform="rotate(25, 1165, 631)"/>
    <polygon points="546,452 617,594 475,594" fill="#e91e63" opacity="0.04"/>
    <polygon points="510,618 543,684 477,684" fill="#e91e63" opacity="0.10"/>
    <polygon points="-54,-163 19,-17 -127,-17" fill="#e91e63" opacity="0.06"/>
    <polygon points="1134,178 1178,266 1090,266" fill="#e91e63" opacity="0.07"/>

  <!-- Wave at bottom -->
  <path d="M0,558 C360,594 840,522 1200,558 L1200,630 L0,630Z" fill="#e91e63" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    강남 셔츠룸
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 서버 웜업
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#fff3e0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#fff3e0" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 강남 셔츠룸 — 서버 웜업
  </text>
</svg>